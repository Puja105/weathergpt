
name: Weather Data Ingestion

on:
  schedule:
    # Run every 3 hours
    - cron: "0 */3 * * *"

  # Allow manual execution from GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and store weather data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m backend.ingest_forecast
